# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: build-and-test

on:
  # build-and-test runs only on PRs (not the redundant post-merge master push -
  # squash-merge already tested that tree on the PR) and skips doc-only changes.
  # workflow_call is kept so tag/release deploy workflows still gate on the tests.
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
  workflow_call:

jobs:
  build:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.x.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
